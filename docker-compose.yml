services:

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./infra/docker/mssql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - faaz-net

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - faaz-net

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - faaz-net

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Faaz.Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FaazDb: "${DB_CONNECTION_STRING}"
      Serilog__SeqUrl: "${SEQ_URL}"
    depends_on:
      identity:
        condition: service_started
      student:
        condition: service_started
      consultant:
        condition: service_started
      booking:
        condition: service_started
      payment:
        condition: service_started
      notification:
        condition: service_started
      administration:
        condition: service_started
    networks:
      - faaz-net

  rabbitmq:
    build:
      context: ./infra/docker/rabbitmq
    container_name: faaz-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - faaz-net

  redis:
    image: redis:7.2-alpine
    container_name: faaz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - faaz-net

  identity:
    build:
      context: .
      dockerfile: src/Services/Identity/Faaz.Services.Identity.WebHost/Dockerfile
    ports:
      - "5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FaazDb: "${DB_CONNECTION_STRING}"
      Jwt__PrivateKeyPem: "${IDENTITY_JWT_PRIVATE_KEY_PEM}"
      ServiceApiKey: "${SERVICE_API_KEY}"
      AdminSeed__Email: "${ADMIN_SEED_EMAIL}"
      AdminSeed__Password: "${ADMIN_SEED_PASSWORD}"
      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "${SMTP_PORT}"
      Smtp__FromEmail: "${SMTP_FROM_EMAIL}"
      Smtp__FromName: "${SMTP_FROM_NAME}"
      Smtp__UseSsl: "${SMTP_USE_SSL}"
      FrontendBaseUrl: "${FRONTEND_BASE_URL}"
      Services__StudentServiceUrl: "http://student:8080"
      Services__ConsultantServiceUrl: "http://consultant:8080"
      RabbitMq__Host: rabbitmq
      RabbitMq__VHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Serilog__SeqUrl: "${SEQ_URL}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - faaz-net

  student:
    build:
      context: .
      dockerfile: src/Services/Student/Faaz.Services.Student.WebHost/Dockerfile
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FaazDb: "${DB_CONNECTION_STRING}"
      Jwt__Authority: "http://identity:8080"
      Jwt__Audience: "faaz-api"
      ServiceApiKey: "${SERVICE_API_KEY}"
      Services__AdministrationServiceUrl: "http://administration:8080"
      RabbitMq__Host: rabbitmq
      RabbitMq__VHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Serilog__SeqUrl: "${SEQ_URL}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - faaz-net

  consultant:
    build:
      context: .
      dockerfile: src/Services/Consultant/Faaz.Services.Consultant.WebHost/Dockerfile
    ports:
      - "5103:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FaazDb: "${DB_CONNECTION_STRING}"
      Jwt__Authority: "http://identity:8080"
      Jwt__Audience: "faaz-api"
      ServiceApiKey: "${SERVICE_API_KEY}"
      Services__AdministrationServiceUrl: "http://administration:8080"
      RabbitMq__Host: rabbitmq
      RabbitMq__VHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Serilog__SeqUrl: "${SEQ_URL}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - faaz-net

  notification:
    build:
      context: .
      dockerfile: src/Services/Notification/Faaz.Services.Notification.WebHost/Dockerfile
    container_name: faaz-notification
    ports:
      - "55133:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FaazDb: "${DB_CONNECTION_STRING}"
      Identity__Authority: "http://identity:8080"
      Identity__JwksUrl: "http://identity:8080/api/v1/auth/.well-known/jwks.json"
      RabbitMq__Host: rabbitmq
      RabbitMq__VHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Redis__ConnectionString: "redis:6379"
      Jwt__Issuer: faaz-identity
      Jwt__Audience: faaz-api
      Smtp__Host: "${SMTP_HOST}"
      Smtp__Port: "${SMTP_PORT}"
      Smtp__FromEmail: "${SMTP_FROM_EMAIL}"
      Smtp__FromName: "${SMTP_FROM_NAME}"
      Smtp__UseSsl: "${SMTP_USE_SSL}"
      FrontendBaseUrl: "${FRONTEND_BASE_URL}"
      Serilog__SeqUrl: "${SEQ_URL}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
    networks:
      - faaz-net

  booking:
    build:
      context: .
      dockerfile: src/Services/Booking/Faaz.Services.Booking.WebHost/Dockerfile
    container_name: faaz-booking
    ports:
      - "55134:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FaazDb: "${DB_CONNECTION_STRING}"
      Identity__Authority: "http://identity:8080"
      Identity__JwksUrl: "http://identity:8080/api/v1/auth/.well-known/jwks.json"
      Jwt__Issuer: faaz-identity
      Jwt__Audience: faaz-api
      RabbitMq__Host: rabbitmq
      RabbitMq__VHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Redis__ConnectionString: "redis:6379"
      LiveKit__ApiKey: "${LIVEKIT_API_KEY}"
      LiveKit__ApiSecret: "${LIVEKIT_API_SECRET}"
      LiveKit__ServerUrl: "${LIVEKIT_SERVER_URL}"
      LiveKit__WebhookSecret: "${LIVEKIT_WEBHOOK_SECRET}"
      Services__ConsultantServiceUrl: "http://consultant:8080"
      Services__PaymentServiceUrl: "http://payment:8080"
      ServiceApiKey: "${SERVICE_API_KEY}"
      Serilog__SeqUrl: "${SEQ_URL}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - faaz-net

  payment:
    build:
      context: .
      dockerfile: src/Services/Payment/Faaz.Services.Payment.WebHost/Dockerfile
    container_name: faaz-payment
    ports:
      - "55135:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FaazDb: "${DB_CONNECTION_STRING}"
      Identity__Authority: "http://identity:8080"
      Identity__JwksUrl: "http://identity:8080/api/v1/auth/.well-known/jwks.json"
      Jwt__Issuer: faaz-identity
      Jwt__Audience: faaz-api
      RabbitMq__Host: rabbitmq
      RabbitMq__VHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Stripe__SecretKey: "${STRIPE_SECRET_KEY}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET}"
      Stripe__CommissionRate: "0.15"
      Services__ConsultantServiceUrl: "http://consultant:8080"
      Services__BookingServiceUrl: "http://booking:8080"
      ServiceApiKey: "${SERVICE_API_KEY}"
      Serilog__SeqUrl: "${SEQ_URL}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - faaz-net

  administration:
    build:
      context: .
      dockerfile: src/Services/Administration/Faaz.Services.Administration.WebHost/Dockerfile
    container_name: faaz-administration
    ports:
      - "55136:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FaazDb: "${DB_CONNECTION_STRING}"
      Jwt__Authority: "http://identity:8080"
      Jwt__Audience: "faaz-api"
      ServiceApiKey: "${SERVICE_API_KEY}"
      Services__ConsultantServiceUrl: "http://consultant:8080"
      Services__BookingServiceUrl: "http://booking:8080"
      Services__PaymentServiceUrl: "http://payment:8080"
      Services__IdentityServiceUrl: "http://identity:8080"
      RabbitMq__Host: rabbitmq
      RabbitMq__VHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Serilog__SeqUrl: "${SEQ_URL}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
    networks:
      - faaz-net

  backgroundjobs:
    build:
      context: .
      dockerfile: src/Services/BackgroundJobs/Faaz.Services.BackgroundJobs.WebHost/Dockerfile
    container_name: faaz-backgroundjobs
    ports:
      - "55137:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FaazDb: "${DB_CONNECTION_STRING}"
      Jwt__Authority: "http://identity:8080"
      Jwt__Audience: "faaz-api"
      ServiceApiKey: "${SERVICE_API_KEY}"
      Services__ConsultantServiceUrl: "http://consultant:8080"
      Services__BookingServiceUrl: "http://booking:8080"
      Services__PaymentServiceUrl: "http://payment:8080"
      RabbitMq__Host: rabbitmq
      RabbitMq__VHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      LiveKit__ApiKey: "${LIVEKIT_API_KEY}"
      LiveKit__ApiSecret: "${LIVEKIT_API_SECRET}"
      LiveKit__ServerUrl: "${LIVEKIT_SERVER_URL}"
      Serilog__SeqUrl: "${SEQ_URL}"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      booking:
        condition: service_started
    networks:
      - faaz-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - faaz-net

volumes:
  mssql_data:
  seq_data:
  rabbitmq_data:
  redis_data:

networks:
  faaz-net:
    driver: bridge
